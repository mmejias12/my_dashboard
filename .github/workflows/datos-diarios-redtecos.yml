name: Datos diarios REDTEC OS

# Mantiene frescas las bases del asistente cada madrugada, sin intervención:
#   1) Backfill pallet  · ventana de 45 días (cubre confirmaciones tardías de
#      transferencias, cuya ventana de gracia es de 40 días) hasta ayer.
#   2) Backfill stock/pool · últimos días; idempotente, salta los ya válidos.
#   3) Rollup histórico · regenera resumen/operaciones.json con los días nuevos,
#      para que el asistente compare años/meses al instante.
#
# Los tres escriben DIRECTO a Azure Blob (storage redtecos); NO tocan el repo.
#
# Secrets que deben existir en el repo (Settings → Secrets and variables → Actions):
#   OS_STORAGE_CONN  · cadena de conexión del storage redtecos
#   REDTEC_API_KEY   · llave de RDTOut (obligatoria para el stock)

on:
  schedule:
    # MEDIDO el 19-10-2026: de los tres intentos declarados antes
    # ('20 8,10,12') llegaban uno o dos, y con 1 a 3 horas de atraso — las
    # corridas aterrizaban entre las 12:13 y las 15:59 UTC, o sea entre las
    # 09:13 y las 12:59 de Chile, pasada la reunión de la mañana. Actions no
    # garantiza el horario: encola y descarta cuando está congestionado, y los
    # minutos redondos son los peores.
    #
    # Por eso: minuto impar (:13) y los tres intentos ADELANTADOS, para que el
    # atraso típico los deje igual dentro de la madrugada. Declarado
    # 03:13 / 06:13 / 08:13 de Chile.
    - cron: '13 6,9,11 * * *'
  workflow_dispatch:
    inputs:
      ops_desde:
        description: 'Operaciones · desde (AAAA-MM-DD). Vacío = ventana diaria de 45 días'
        required: false
        default: ''
      ops_hasta:
        description: 'Operaciones · hasta (AAAA-MM-DD). Vacío = ayer'
        required: false
        default: ''
      solo_operaciones:
        description: 'Correr SÓLO el paso de operaciones (reparación: no toca stock, pallet ni rollups)'
        type: boolean
        required: false
        default: false

concurrency:
  group: datos-diarios-redtecos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OS_STORAGE_CONN: ${{ secrets.OS_STORAGE_CONN }}
      REDTEC_API_KEY: ${{ secrets.REDTEC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependencia de Azure Blob
        run: npm install @azure/storage-blob@^12 --no-save

      - name: Calcular fechas (zona Chile)
        id: f
        # Las fechas que vienen del formulario entran por env y se validan antes
        # de escribirlas: lo que llega de un input no se interpola suelto dentro
        # de un run.
        env:
          IN_DESDE: ${{ inputs.ops_desde }}
          IN_HASTA: ${{ inputs.ops_hasta }}
        run: |
          set -euo pipefail
          iso='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          for v in "${IN_DESDE:-}" "${IN_HASTA:-}"; do
            if [ -n "$v" ] && ! [[ $v =~ $iso ]]; then
              echo "::error::fecha inválida '$v' — se espera AAAA-MM-DD"; exit 1
            fi
          done
          AYER=$(TZ=America/Santiago date -d 'yesterday' +%F)
          D45=$(TZ=America/Santiago date -d '45 days ago' +%F)
          echo "ayer=$AYER" >> "$GITHUB_OUTPUT"
          echo "desde45=$D45" >> "$GITHUB_OUTPUT"
          echo "desde10=$(TZ=America/Santiago date -d '10 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "opsDesde=${IN_DESDE:-$D45}" >> "$GITHUB_OUTPUT"
          echo "opsHasta=${IN_HASTA:-$AYER}" >> "$GITHUB_OUTPUT"

      - name: 1) Backfill pallet (ventana 45 días → ayer)
        if: ${{ inputs.solo_operaciones != true }}
        run: node backfill/backfill.js ${{ steps.f.outputs.desde45 }} ${{ steps.f.outputs.ayer }}

      - name: 2) Backfill stock / pool (últimos días → ayer)
        if: ${{ inputs.solo_operaciones != true }}
        run: node backfill/backfill-stock.js ${{ steps.f.outputs.desde10 }}

      # Operaciones del pool DIRECTO desde Redlink (API portal, Keycloak), en
      # reemplazo de M2LINK. Ventana de 45 días para capturar confirmaciones
      # tardías (idempotente: reescribe el blob del día, clave formHeaderiD).
      # Escribe en su propio contenedor (redtec-os-operaciones); no toca lo demás.
      - name: 2b) Operaciones del pool (Redlink → Blob)
        env:
          REDLINK_USER:          ${{ secrets.REDLINK_USER }}
          REDLINK_PASS:          ${{ secrets.REDLINK_PASS }}
          REDLINK_CLIENT_SECRET: ${{ secrets.REDLINK_CLIENT_SECRET }}
        run: node backfill/backfill-operaciones.js ${{ steps.f.outputs.opsDesde }} ${{ steps.f.outputs.opsHasta }}

      - name: 3) Rollup histórico (resumen/operaciones.json)
        if: ${{ inputs.solo_operaciones != true }}
        run: node scripts/rollup-operaciones.js ${{ steps.f.outputs.ayer }}

      # El rollup de arriba resume por mes y planta, pero BOTA el desglose por
      # contraparte que el blob diario ya trae. Sin esa dimensión, "cuántas
      # transferencias a Walmart" no tiene respuesta precalculada, el asistente
      # cae a consultar en vivo y se pega: medido el 17-09, a 90 días RDTOut ya
      # responde 502 por timeout y a 365 devuelve 400.
      - name: 3b) Rollup por contraparte (resumen/contrapartes.json)
        if: ${{ inputs.solo_operaciones != true }}
        run: node scripts/rollup-contrapartes.js ${{ steps.f.outputs.ayer }}

      # La serie DIARIA que consume el tablero OPERACIONES REDTEC. Son seis
      # números por día (0,29 KB medidos), así que el navegador se la baja UNA
      # vez y arma cualquier período — día, semana, mes, año — sin volver a
      # preguntar. Ésa es la diferencia con la consulta que se caía: pedirle 12
      # meses de crudo a RDTOut devuelve 400, y a 90 días ya responde 502.
      - name: 3c) Rollup diario (resumen/diario.json)
        if: ${{ inputs.solo_operaciones != true }}
        run: node scripts/rollup-diario.js ${{ steps.f.outputs.ayer }}

      # Índice de transferencias: despachado vs confirmado, etapas y el par
      # cliente origen → retail destino. Lee RDTOut DIRECTO y no los blobs
      # diarios: ésos se congelan a los 45 días y pierden las confirmaciones
      # tardías (medido: 3.374 pallets sólo en Walmart a 12 meses).
      - name: 3d) Rollup de transferencias (resumen/transferencias.json)
        if: ${{ inputs.solo_operaciones != true }}
        run: node scripts/rollup-transferencias.js

      - name: 4) Refrescar snapshot (semana en curso / flota / asistencia / stock)
        if: ${{ inputs.solo_operaciones != true }}
        env:
          INGESTA_URL: ${{ secrets.INGESTA_URL }}
          OS_INGESTA_KEY: ${{ secrets.OS_INGESTA_KEY }}
        run: |
          if [ -z "$INGESTA_URL" ] || [ -z "$OS_INGESTA_KEY" ]; then
            echo "INGESTA_URL / OS_INGESTA_KEY no configurados aún; se omite el refresco del snapshot."
            exit 0
          fi
          echo "Refrescando snapshot vía $INGESTA_URL ..."
          curl -fsS -X POST "$INGESTA_URL" \
            -H "X-Ingesta-Key: $OS_INGESTA_KEY" \
            -H "Content-Type: application/json"
          echo ""
          echo "✓ Snapshot refrescado."
