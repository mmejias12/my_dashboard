<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDTEC · Gestión Operacional</title>

<style>
/* =========================================================================
   Gestión Operacional · formularios de inventario y consumos
   Los tokens, la tipografía y el molde del encabezado son los mismos de
   operaciones-redtec.html y monitor-anden.html a propósito: una pantalla
   nueva que inventa su propia paleta se ve como un injerto.
   ========================================================================= */
:root{
  color-scheme: dark;
  --plane:#0A0C11; --surface:#12151C; --surface-2:#171B24; --surface-3:#1E2431;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --text:#FFFFFF; --text-2:#AEB6C4; --muted:#79818F;
  --brand:#E02B20;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --series-1:#3987e5;
  /* El pallet blanco es blanco y el rojo es rojo: el color lo dice literal,
     igual que en el monitor del andén. */
  --blanco:#cfd6e4;
  --r:12px;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit}

.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.logo{width:30px;height:30px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;border-radius:8px}
.logo img{width:26px;height:26px;object-fit:contain;display:block}
.top h1{font-size:15px}
.sub{font-size:11px;color:var(--muted)}
.fuente{font-size:10.5px;letter-spacing:.01em;cursor:help;border-bottom:1px dotted var(--line);padding-bottom:1px;color:var(--muted)}
.crece{flex:1}

.wrap{max-width:1040px;margin:0 auto;padding:18px 20px 60px}

.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:max-content;max-width:100%;overflow:auto}
.seg button{background:transparent;border:0;color:var(--text-2);border-radius:7px;padding:7px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface-3);color:var(--text)}
.seg button:hover:not(.on){color:var(--text)}

.areas{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 0}
.areas button{background:var(--surface);border:1px solid var(--line);color:var(--text-2);border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;text-align:left}
.areas button.on{border-color:rgba(224,43,32,.55);background:rgba(224,43,32,.1);color:var(--text)}
.areas button small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card > .chead{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.chead h2{font-size:14px}
.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nota{font-size:11.5px;color:var(--text-2);margin:6px 0 0}

.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0 0}

fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:14px 0 0;background:var(--surface-2)}
fieldset.redtec{border-left:3px solid var(--brand)}
fieldset.rt{border-left:3px solid var(--blanco)}
legend{font-size:12px;font-weight:600;padding:0 6px;color:var(--text)}
legend .pill{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:7px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--text-2)}
label.campo > span{display:flex;align-items:center;gap:6px}
input,select{width:100%;background:var(--surface-3);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--series-1)}
input.mal{border-color:var(--critical);background:rgba(208,59,59,.08)}
input[type=number]{font-variant-numeric:tabular-nums}
.chip{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--warning);border:1px solid rgba(250,178,25,.4);border-radius:999px;padding:1px 6px;cursor:help}

.cuadre{margin:11px 0 0;font-size:11.5px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.cuadre b{font-variant-numeric:tabular-nums;color:var(--text)}
.cuadre.pasa{color:#f3b1b1}
.cuadre.pasa b{color:#ffc9c9}

.pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 0}
.btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 15px;font-size:12.5px;cursor:pointer;min-height:38px}
.btn:hover{border-color:rgba(255,255,255,.26)}
.btn.primario{background:rgba(224,43,32,.16);border-color:rgba(224,43,32,.5);color:#ffb3ad}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.aviso{font-size:11.5px;color:#f3b1b1}

pre.payload{background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:12px;margin:14px 0 0;
  font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-word}

.porconfirmar{border:1px dashed rgba(250,178,25,.45);background:rgba(250,178,25,.06);border-radius:10px;padding:10px 12px;margin:14px 0 0;font-size:11.5px;color:#f1d9a6}
@media (max-width:620px){ .wrap{padding:14px 12px 50px} .top{padding:10px 12px} }
</style>
</head>

    <h1>Gestión Operacional</h1>
    <div class="sub">Formularios de inventario y consumos · <span class="fuente" id="fuente" title="">cargando definición…</span></div>
  </div>
  <div class="crece"></div>
</div>

<div class="wrap">

  <div class="seg" id="familias">
    <button data-fam="inventario" class="on">Inventario</button>
    <button data-fam="consumos">Consumos y rendimientos</button>
  </div>

  <div class="areas" id="areas"></div>

  <div id="formulario"></div>

  <div id="salida"></div>

</div>

<script>
/* ===========================================================================
   De dónde salen los campos: de data/gestion-operacional.json, NO de acá.
   La página de Enrique es un front genérico que le pide la definición a
   /api/v2/bootstrap; ese backend no existe en el m3link, así que la
   definición vive en un archivo del repo y esta vista sólo la pinta. Cambiar
   una etiqueta o sacar un campo es editar ese JSON.

   POR AHORA NO GUARDA, a propósito (así se pidió): el botón arma el payload
   y lo muestra. Cuando se conecte, va al mismo storage que usa todo lo demás
   (OS_STORAGE_CONN), con una Function propia al estilo de retiros-store.
   =========================================================================== */
'use strict';

var DEF = null, FAM = 'inventario', AREA = null, FORM = null;
var DEST = 'Azure Blob (OS_STORAGE_CONN) · pendiente de conectar';

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]; }); }
function num(v){ var n = Number(v); return Number.isFinite(n) ? n : 0; }
function miles(n){ return num(n).toLocaleString('es-CL'); }
function hoy(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santiago',
    year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
var $ = function(id){ return document.getElementById(id); };

/* ── La regla del cuadre ───────────────────────────────────────────────────
   El total declarado NO puede ser superado por la suma de los campos que lo
   distribuyen. Puede quedar saldo sin distribuir (eso es informativo), pero
   pasarse es un error y no deja enviar: si la suma excede el total, alguno de
   los cuatro números está mal y guardarlo ensucia el consolidado.           */
function cuadre(seccion, valores){
  if (!seccion.total || !seccion.distribuyen) return null;
  var total = num(valores[seccion.total]);
  var suma = seccion.distribuyen.reduce(function(a,k){ return a + num(valores[k]); }, 0);
  return { total: total, suma: suma, saldo: total - suma, pasa: suma > total };
}

function campoHTML(seccion, campo){
  var paso = campo.tipo === 'decimal' ? '0.01' : '1';
  var chip = campo.inferido
    ? ' <span class="chip" title="Etiqueta reconstruida: hay que confirmarla con Enrique">por confirmar</span>' : '';
  return '<label class="campo"><span>' + esc(campo.etiqueta) + ' *' + chip + '</span>' +
    '<input type="number" min="0" step="' + paso + '" required ' +
    'name="' + esc(seccion.pallet + '|' + campo.clave) + '" ' +
    'data-sec="' + esc(seccion.nombre) + '" data-clave="' + esc(campo.clave) + '"></label>';
}

function seccionHTML(seccion){
  var clase = seccion.pallet === 'RT' ? 'rt' : 'redtec';
  var pill = seccion.pallet === 'RT' ? 'RT · blancos' : 'REDTEC · rojos';
  return '<fieldset class="' + clase + '" data-sec="' + esc(seccion.nombre) + '">' +
    '<legend>' + esc(seccion.nombre) + '<span class="pill">' + pill + '</span></legend>' +
    '<div class="grid">' + seccion.campos.map(function(c){ return campoHTML(seccion,c); }).join('') + '</div>' +
    (seccion.total ? '<div class="cuadre" data-cuadre="' + esc(seccion.nombre) + '"></div>' : '') +
    '</fieldset>';
}

function identHTML(campos){
  var h = '<div class="ident">';
  if (campos.indexOf('fecha') >= 0)
    h += '<label class="campo"><span>Fecha *</span><input type="date" name="_fecha" value="' + hoy() + '" required></label>';
  if (campos.indexOf('supervisor') >= 0)
    h += '<label class="campo"><span>Supervisor *</span><input name="_supervisor" required placeholder="Nombre y apellido"></label>';
  if (campos.indexOf('centro') >= 0)
    h += '<label class="campo"><span>Centro *</span><select name="_centro">' +
      (DEF.centros||[]).map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.nombre) + '</option>'; }).join('') +
      '</select></label>';
  if (campos.indexOf('area') >= 0)
    h += '<label class="campo"><span>Área *</span><select name="_area">' +
      (FORM.areas||[]).map(function(id){
        var a = (DEF.inventario||[]).find(function(x){ return x.area === id; });
        return '<option value="' + esc(id) + '">' + esc(a ? a.nombre : id) + '</option>'; }).join('') +
      '</select></label>';
  if (campos.indexOf('operador') >= 0)
    h += '<label class="campo"><span>Operador *</span><input name="_operador" required placeholder="Nombre y apellido"></label>';
  return h + '</div>';
}

function materialesHTML(materiales){
  if (!materiales || !materiales.length) return '';
  return '<fieldset><legend>Materiales consumidos<span class="pill">cantidad y unidad</span></legend>' +
    '<div class="grid">' + materiales.map(function(m){
      var chip = m.inferido ? ' <span class="chip" title="Por confirmar con Enrique">por confirmar</span>' : '';
      var uni = (m.unidades||['unidades']).map(function(u){
        return '<option value="' + esc(u) + '">' + (u === 'rollos' ? 'Rollos' : 'Unidades') + '</option>'; }).join('');
      return '<label class="campo"><span>' + esc(m.etiqueta) + chip + '</span>' +
        '<input type="number" min="0" step="0.01" name="mat|' + esc(m.clave) + '" placeholder="Cantidad"></label>' +
        '<label class="campo"><span>Unidad de ' + esc(m.etiqueta.toLowerCase()) + '</span>' +
        '<select name="uni|' + esc(m.clave) + '">' + uni + '</select></label>';
    }).join('') + '</div></fieldset>';
}

function pintarAreas(){
  var cont = $('areas');
  if (FAM === 'inventario') {
    cont.innerHTML = (DEF.inventario||[]).map(function(a){
      return '<button data-area="' + esc(a.area) + '"' + (a.area === AREA ? ' class="on"' : '') + '>' +
        esc(a.nombre) + '<small>' + esc(a.rotulo) + '</small></button>'; }).join('');
  } else {
    cont.innerHTML = (DEF.consumos||[]).map(function(f){
      return '<button data-form="' + esc(f.formulario) + '"' + (f.formulario === (FORM && FORM.formulario) ? ' class="on"' : '') + '>' +
        esc(f.nombre) + '<small>' + esc(f.rotulo) + '</small></button>'; }).join('');
  }
}

function pintarFormulario(){
  var caja = $('formulario');
  $('salida').innerHTML = '';
  var def, secciones, ident, materiales, rotulo, nombre, resumen, porConfirmar;

  if (FAM === 'inventario') {
    def = (DEF.inventario||[]).find(function(a){ return a.area === AREA; });
    if (!def) { caja.innerHTML = ''; return; }
    secciones = def.secciones; ident = ['fecha','supervisor'];
    materiales = null; rotulo = def.rotulo; nombre = def.nombre;
    resumen = def.resumen; porConfirmar = def.porConfirmar;
  } else {
    def = FORM;
    if (!def) { caja.innerHTML = ''; return; }
    secciones = (def.secciones||[]).map(function(s){ return Object.assign({ pallet: def.pallet || 'REDTEC' }, s); });
    ident = def.identificacion || ['fecha','supervisor'];
    materiales = def.materiales; rotulo = def.rotulo; nombre = def.nombre;
    resumen = def.resumen; porConfirmar = def.porConfirmar;
  }

  caja.innerHTML = '<div class="card"><div class="chead"><div class="eyebrow">' + esc(rotulo) + '</div>' +
    '<h2>' + esc(nombre) + '</h2></div>' +
    '<p class="nota">' + esc(resumen || '') + '</p>' +
    (porConfirmar ? '<div class="porconfirmar">Esta sección quedó reconstruida y no está confirmada con Enrique: ' +
      'revisar los campos antes de usarla en la operación.</div>' : '') +
    '<form id="f">' + identHTML(ident) +
    secciones.map(seccionHTML).join('') +
    materialesHTML(materiales) +
    '<div class="pie">' +
      '<button type="submit" class="btn primario" id="enviar">Revisar envío</button>' +
      '<span class="aviso" id="estado"></span>' +
    '</div></form></div>';

  var form = $('f');
  form.addEventListener('input', revisar);
  form.addEventListener('submit', function(e){ e.preventDefault(); enviar(); });
  revisar();
}

function valoresDe(form){
  var out = {};
  Array.prototype.forEach.call(form.querySelectorAll('input[data-sec]'), function(i){
    (out[i.getAttribute('data-sec')] = out[i.getAttribute('data-sec')] || {})[i.getAttribute('data-clave')] = i.value;
  });
  return out;
}

function seccionesActivas(){
  if (FAM === 'inventario') {
    var a = (DEF.inventario||[]).find(function(x){ return x.area === AREA; });
    return a ? a.secciones : [];
  }
  return FORM ? (FORM.secciones||[]) : [];
}

/* Revisa el cuadre de cada sección con total y deja el estado a la vista.
   Devuelve las secciones que se pasaron, que es lo que bloquea el envío. */
function revisar(){
  var form = $('f'); if (!form) return [];
  var vals = valoresDe(form), pasadas = [];
  seccionesActivas().forEach(function(sec){
    var c = cuadre(sec, vals[sec.nombre] || {});
    if (!c) return;
    var caja = form.querySelector('[data-cuadre="' + sec.nombre.replace(/"/g,'\\"') + '"]');
    if (caja) {
      caja.className = 'cuadre' + (c.pasa ? ' pasa' : '');
      caja.innerHTML = 'Declarado <b>' + miles(c.total) + '</b>' +
        '<span>Distribuido <b>' + miles(c.suma) + '</b></span>' +
        (c.pasa
          ? '<span>Se pasa por <b>' + miles(-c.saldo) + '</b> — la suma no puede superar el total</span>'
          : '<span>Sin distribuir <b>' + miles(c.saldo) + '</b></span>');
    }
    sec.distribuyen.concat([sec.total]).forEach(function(k){
      var inp = form.querySelector('input[data-sec="' + sec.nombre.replace(/"/g,'\\"') + '"][data-clave="' + k + '"]');
      if (inp) inp.classList.toggle('mal', c.pasa);
    });
    if (c.pasa) pasadas.push(sec.nombre);
  });
  var est = $('estado'), env = $('enviar');
  if (est) est.textContent = pasadas.length
    ? 'Hay ' + pasadas.length + ' sección(es) donde la distribución supera el total declarado.' : '';
  if (env) env.disabled = pasadas.length > 0;
  return pasadas;
}

function enviar(){
  var form = $('f');
  if (revisar().length) return;
  if (!form.reportValidity()) return;
  var datos = new FormData(form), ident = {}, valores = {}, materiales = {};
  datos.forEach(function(v, k){
    if (k.indexOf('_') === 0) ident[k.slice(1)] = v;
    else if (k.indexOf('mat|') === 0) (materiales[k.slice(4)] = materiales[k.slice(4)] || {}).cantidad = v;
    else if (k.indexOf('uni|') === 0) (materiales[k.slice(4)] = materiales[k.slice(4)] || {}).unidad = v;
    else { var p = k.split('|'); (valores[p[0]] = valores[p[0]] || {})[p[1]] = v; }
  });
  /* Si la unidad elegida trae un factor declarado en la definicion, el factor
     viaja con el dato. No se convierte acá a proposito: ese factor todavia esta
     por confirmar, y una cuenta hecha con un factor equivocado se ve exactamente
     igual de bien que una correcta. */
  if (FAM === 'consumos' && FORM) {
    (FORM.materiales || []).forEach(function(m){
      var d = materiales[m.clave];
      if (d && d.unidad === 'rollos' && m.porRollo) d.porRollo = m.porRollo;
    });
  }
  var payload = {
    familia: FAM,
    formulario: FAM === 'inventario' ? AREA : FORM.formulario,
    identificacion: ident,
    valores: valores
  };
  if (Object.keys(materiales).length) payload.materiales = materiales;
  $('salida').innerHTML = '<div class="card"><div class="chead"><div class="eyebrow">ESTO SE ENVIARÍA</div>' +
    '<h2>Payload del registro</h2></div>' +
    '<p class="nota">Todavía no se guarda nada: así se acordó para esta etapa. El destino cuando se conecte es ' +
    esc(DEST) + ', con una Function propia al estilo de <code>retiros-store</code>.</p>' +
    '<pre class="payload" id="json">' + esc(JSON.stringify(payload, null, 2)) + '</pre></div>';
  $('salida').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('familias').addEventListener('click', function(e){
  var b = e.target.closest('button[data-fam]'); if (!b) return;
  FAM = b.getAttribute('data-fam');
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x === b); });
  if (FAM === 'consumos') FORM = (DEF.consumos||[])[0] || null;
  else AREA = ((DEF.inventario||[])[0]||{}).area || null;
  pintarAreas(); pintarFormulario();
});

$('areas').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-area')) AREA = b.getAttribute('data-area');
  else FORM = (DEF.consumos||[]).find(function(f){ return f.formulario === b.getAttribute('data-form'); });
  pintarAreas(); pintarFormulario();
});

(function arranque(){
  fetch('data/gestion-operacional.json', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){
      DEF = d;
      AREA = ((d.inventario||[])[0]||{}).area || null;
      FORM = (d.consumos||[])[0] || null;
      var inf = 0, sec = 0;
      (d.inventario||[]).forEach(function(a){ (a.secciones||[]).forEach(function(s){
        sec++; (s.campos||[]).forEach(function(c){ if (c.inferido) inf++; }); }); });
      var f = $('fuente');
      f.textContent = 'definición: data/gestion-operacional.json · ' + sec + ' secciones' +
        (inf ? ' · ' + inf + ' campos por confirmar' : '');
      f.title = 'Los campos no están escritos en esta página: salen del JSON del repo. ' +
        'La página original de Enrique los pedía a /api/v2/bootstrap, backend que el m3link no tiene.';
      pintarAreas(); pintarFormulario();
    })
    .catch(function(e){
      $('fuente').textContent = 'no se pudo leer la definición';
      $('formulario').innerHTML = '<div class="card"><div class="chead"><h2>Falta la definición de los formularios</h2></div>' +
        '<p class="nota">No se pudo leer <code>data/gestion-operacional.json</code> (' + esc(e.message) + '). ' +
        'Esta pantalla no trae campos escritos en el código a propósito: sin ese archivo no hay nada que pintar.</p></div>';
    });
})();
</script>
