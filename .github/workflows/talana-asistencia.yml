name: Asistencia Talana

# Mantiene fresco el snapshot que alimenta asistencia-aldia.html.
#
# Static Web Apps sólo admite triggers HTTP en sus Functions gestionadas, así
# que el reloj vive aquí y sólo golpea POST /api/talana-sync.
#
# El sync es INCREMENTAL a propósito: Talana bloquea 10 minutos una URL que
# supere las ~50 peticiones por minuto, así que cada llamada avanza lo que
# alcanza dentro de su presupuesto de tiempo y devuelve cuántos días quedan.
# Este job reintenta hasta que `pendientes` llega a 0.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   TALANA_SYNC_URL   https://<tu-swa>.azurestaticapps.net/api/talana-sync
#   OS_INGESTA_KEY    misma llave compartida que ya usa os-ingesta-http

on:
  schedule:
    # UTC. Chile es UTC-4/-3 → aprox. 05:10, 09:10, 13:10, 17:10 y 21:10 local.
    - cron: '10 1,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha inicial YYYY-MM-DD (vacío = día 1 del mes en curso)'
        required: false
      hasta:
        description: 'Fecha final YYYY-MM-DD (vacío = hoy)'
        required: false
      maestros:
        description: 'Forzar refresco de personas, turnos y asignaciones'
        type: boolean
        default: false

concurrency:
  group: talana-asistencia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sincronizar Talana → snapshot
        env:
          URL:         ${{ secrets.TALANA_SYNC_URL }}
          INGESTA_URL: ${{ secrets.INGESTA_URL }}
          KEY:         ${{ secrets.OS_INGESTA_KEY }}
          DESDE:       ${{ inputs.desde }}
          HASTA:       ${{ inputs.hasta }}
          MAESTROS:    ${{ inputs.maestros }}
        run: |
          set -euo pipefail

          # La URL del sincronizador se puede fijar en TALANA_SYNC_URL, pero si no
          # existe se deriva de INGESTA_URL: es el mismo Static Web App, otra ruta.
          # Así no hay que crear un secret nuevo sólo para repetir el host.
          if [ -z "${URL:-}" ] && [ -n "${INGESTA_URL:-}" ]; then
            URL="$(printf '%s' "$INGESTA_URL" | sed -E 's#(https?://[^/]+).*#\1#')/api/talana-sync"
            echo "TALANA_SYNC_URL no está definido; se deriva de INGESTA_URL."
          fi

          if [ -z "${URL:-}" ]; then
            echo "::error::Falta el secret TALANA_SYNC_URL (o INGESTA_URL, del que se deriva)."
            exit 1
          fi
          if [ -z "${KEY:-}" ]; then
            echo "::error::Falta el secret OS_INGESTA_KEY. Es la llave compartida con tu propia Function, no una credencial de Talana."
            exit 1
          fi

          cuerpo='{}'
          if [ -n "${DESDE:-}" ] || [ -n "${HASTA:-}" ] || [ "${MAESTROS:-false}" = "true" ]; then
            cuerpo=$(jq -nc \
              --arg d "${DESDE:-}" --arg h "${HASTA:-}" --argjson m "${MAESTROS:-false}" \
              '{} + (if $d != "" then {desde:$d} else {} end)
                  + (if $h != "" then {hasta:$h} else {} end)
                  + (if $m       then {maestros:true} else {} end)')
          fi
          echo "Cuerpo: $cuerpo"

          # Hasta 12 pasadas: cubre un backfill de un mes completo desde cero.
          for i in $(seq 1 12); do
            echo "── Pasada $i ──────────────────────────────────────────────"

            # Sin -f, para poder leer el cuerpo de un 4xx/5xx en vez de sólo
            # "curl falló": el sincronizador explica en el JSON qué pasó.
            respuesta=$(curl -sS --max-time 150 -w '\n%{http_code}' -X POST "$URL" \
              -H "X-Ingesta-Key: $KEY" \
              -H "Content-Type: application/json" \
              -d "$cuerpo") || { echo "::error::No se pudo conectar con el sincronizador."; exit 1; }

            codigo="$(printf '%s' "$respuesta" | tail -n1)"
            cuerpo_resp="$(printf '%s' "$respuesta" | sed '$d')"

            if [ "$codigo" != "200" ]; then
              echo "::error::El sincronizador respondió HTTP $codigo"
              echo "$cuerpo_resp" | head -c 2000
              exit 1
            fi
            if ! printf '%s' "$cuerpo_resp" | jq -e . >/dev/null 2>&1; then
              echo "::error::Respuesta no es JSON. ¿La URL apunta al Static Web App correcto?"
              echo "$cuerpo_resp" | head -c 500
              exit 1
            fi

            echo "$cuerpo_resp" | jq '{ok, maestros, sincronizados:(.dias_sincronizados|length), pendientes, ausencias, avisos}'

            # Los avisos no son decorativos: ahí sale si faltan permisos de Talana.
            printf '%s' "$cuerpo_resp" | jq -r '.avisos[]? | select(test("SIN HORARIO"))' \
              | while read -r a; do echo "::warning::$a"; done

            if [ "$(printf '%s' "$cuerpo_resp" | jq -r '.ok')" != "true" ]; then
              echo "::error::El sincronizador terminó con ok:false"
              printf '%s' "$cuerpo_resp" | jq -r '.avisos[]?'
              exit 1
            fi

            pendientes=$(printf '%s' "$cuerpo_resp" | jq -r '.pendientes // 0')
            if [ "$pendientes" = "0" ]; then
              echo "✓ Snapshot al día."
              exit 0
            fi

            # Los maestros ya quedaron frescos en la primera pasada.
            cuerpo=$(echo "$cuerpo" | jq -c 'del(.maestros)')
            echo "Quedan $pendientes días; esperando antes de continuar…"
            sleep 45
          done

          echo "::warning::Quedaron días pendientes tras 12 pasadas. La próxima ejecución programada los completará."
