*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#0F1117; --surf:#181B23; --card:#1E222D; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
 --txt:#E8EAF0; --dim:#9DA3B4; --mute:#5A6070; --faint:#3D4253;
 --red:#E30514; --today:rgba(78,167,46,.14); --todayln:#4EA72E; --sab:rgba(96,165,250,.05);
 --mono:'JetBrains Mono',monospace; --body:'Inter',sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:13px;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}::-webkit-scrollbar-track{background:var(--surf)}

.topbar{position:sticky;top:0;z-index:60;height:50px;background:var(--surf);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:11px;padding:0 20px}
.hlogo{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(227,5,20,.3))}
.lname{font-weight:700;font-size:14px;letter-spacing:.3px}
.lsep{width:1px;height:18px;background:var(--line2)}
.ttl{font-size:12.5px;color:var(--dim)}
.ttl b{color:var(--txt);font-weight:600}
.tag{font-family:var(--mono);font-size:8.5px;color:var(--mute);border:1px solid var(--line2);border-radius:20px;padding:2px 7px;letter-spacing:.5px;text-transform:uppercase}
.tsp{flex:1}
.user{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:12px}
.ava{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--red),#8f0a12);display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}

.bar{position:sticky;top:50px;z-index:55;background:rgba(15,17,23,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:11px 20px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;font-family:var(--body);font-size:12.5px;color:var(--dim);
 background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;transition:.14s}
.chip:hover{color:var(--txt);border-color:var(--line2)}
.chip .cdot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.active{color:var(--txt);border-color:var(--line2);background:var(--surf)}
.chip.active[data-a]:not([data-a=all]){border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip[data-a=all].active{border-color:var(--line2);box-shadow:inset 0 0 0 1px var(--line2)}
.spacer{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--mono);font-size:11px;color:var(--dim);background:none;border:none;padding:7px 13px;cursor:pointer;transition:.13s}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--surf);color:var(--txt)}
.period{font-family:var(--mono);font-size:11px;color:var(--mute)}
.period b{color:var(--dim)}

.tablewrap{overflow:auto;padding:0 0 2px;flex:1;min-height:0;min-width:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px}
th,td{text-align:right;padding:0;white-space:nowrap}
thead th{position:sticky;z-index:40;background:var(--surf);font-weight:500}
thead tr:first-child th{top:0}
.gh{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);
 padding:9px 12px;border-bottom:1px solid var(--line);text-align:center}
.gh.actual{color:var(--todayln)}
thead tr:nth-child(2) th{top:33px;padding:7px 12px;border-bottom:1px solid var(--line2)}
th.concept{left:0;z-index:45;text-align:left;padding:9px 16px;min-width:270px;width:270px;
 border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surf)}
th .wn{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--txt)}
th .wd{display:block;font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:2px}
th.curwk .wn,th.today .wn{color:var(--todayln)}
th.cday{min-width:66px}
th.cweek{min-width:70px;background:#1a1d26}

tbody td{border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;padding:9px 12px;color:var(--txt)}
td.concept{position:sticky;left:0;z-index:30;text-align:left;font-family:var(--body);font-size:12.5px;color:var(--dim);
 background:var(--bg);border-right:1px solid var(--line2);padding:9px 16px 9px 14px;font-weight:500}
.kbar{display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--ac);margin-right:9px;vertical-align:-1px;opacity:.85}
td.cweek{background:rgba(255,255,255,.012)}
td.curwk{color:var(--txt);background:rgba(78,167,46,.05)}
td.today{background:var(--today);box-shadow:inset 1px 0 0 rgba(78,167,46,.3),inset -1px 0 0 rgba(78,167,46,.3)}
td.sab{background:var(--sab)}
td.z{color:var(--faint)}
tbody tr.krow:hover td:not(.concept){background:rgba(255,255,255,.035)}
tbody tr.krow:hover td.concept{color:var(--txt);background:#12141b}
tr.strong td{font-weight:600;font-size:14px;border-top:1px solid var(--line2)}
tr.strong td.concept{color:var(--txt);font-family:var(--body)}

tr.secrow td{background:#13151c;border-bottom:1px solid var(--line2);border-top:1px solid var(--line);
 position:sticky;left:0}
.secname{text-align:left!important;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.8px;
 text-transform:uppercase;color:var(--dim);padding:8px 16px!important;position:relative}
.secname .secdot{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--ac);margin-right:9px;vertical-align:0}
.secname .secarea{float:right;font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--ac);
 text-transform:uppercase;border:1px solid var(--ac);border-radius:5px;padding:2px 7px;opacity:.85}

/* view toggle */
.vwrap.vweek .cday{display:none}
.vwrap.vday .cweek{display:none}

.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;color:var(--mute);
 font-size:11px;border-top:1px solid var(--line)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 20px 34px;
 font-family:var(--mono);font-size:10.5px;color:var(--mute)}
footer b{color:var(--dim);font-weight:500}
.hidden{display:none!important}
@media(max-width:760px){th.concept,td.concept{min-width:180px;width:180px}}

.nav{display:flex;align-items:center;gap:4px}
.nav button{font-family:var(--mono);font-size:13px;color:var(--dim);background:var(--card);border:1px solid var(--line);
 border-radius:7px;width:30px;height:30px;cursor:pointer;transition:.13s;display:grid;place-items:center}
.nav button:hover:not(:disabled){color:var(--txt);border-color:var(--line2);background:var(--surf)}
.nav button:disabled{opacity:.32;cursor:not-allowed}
.nav .today{width:auto;padding:0 11px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
.period{min-width:210px;text-align:center}
.period b{color:var(--txt)}
.dl{display:flex;align-items:center;gap:7px;font-family:var(--body);font-size:12px;color:var(--txt);
 background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;transition:.14s}
.dl:hover{border-color:#4EA72E;box-shadow:inset 0 0 0 1px rgba(78,167,46,.5)}
.dl svg{width:14px;height:14px}
.dl:disabled{opacity:.5;cursor:wait}

/* --- layout: grid scrolls internally, header & concept stay fixed --- */
.topbar,.bar,.legend,footer{flex-shrink:0}
.vwrap{flex:1;min-height:0;display:flex}
/* --- crosshair / L guide on hover --- */
tbody td.colhi{box-shadow:inset 0 0 0 999px rgba(255,255,255,.05)}
tbody td.cellhi{box-shadow:inset 0 0 0 999px rgba(78,167,46,.22)}
thead th.colhi-h{background:#20242f}
thead th.colhi-h .wn{color:var(--todayln)}

function cell(v,cls){cls=cls||'';const z=(v==='—')?' z':'';return `<td class="${cls}${z}">${esc(v)}</td>`;}

function exportXLSX(){
